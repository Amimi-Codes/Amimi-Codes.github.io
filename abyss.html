<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#010c14" />
    <meta name="description" content="The Abyss: works in progress and experiments by Amy Cui. Under construction." />
    <title>The Abyss — Designs By Amy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        --x: 50%; --y: 45%;
        min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden;
        font-family: "DM Sans", sans-serif; color: #e6f7fa; text-align: center;
        background: #010c14;
      }
      /* the flashlight: a soft circle of light that follows the pointer */
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle 260px at var(--x) var(--y), #0d4a5e 0%, #052233 45%, #010c14 100%);
      }
      main { position: relative; display: grid; justify-items: center; gap: 28px; }
      .sign { position: relative; padding-top: 0; }
      .sign::before { /* post */
        content: ""; position: absolute; left: 50%; top: 60%; width: 18px; height: 60vh; translate: -50% 0; z-index: -1;
        background: linear-gradient(90deg, #3d2a1a, #6b4a2e 45%, #3d2a1a);
      }
      .plank {
        display: block; padding: 22px 40px; rotate: -3deg; border-radius: 6px;
        background: repeating-linear-gradient(0deg, #8a6230 0 9px, #7a5527 9px 11px), #8a6230;
        box-shadow: inset 0 0 0 3px #5a3a17, 0 18px 40px #000a;
        font: 800 clamp(1.6rem, 6vw, 2.8rem)/1.1 Manrope, sans-serif; letter-spacing: -0.02em; color: #fff3da;
        text-shadow: 0 2px 0 #5a3a17;
      }
      .plank + .plank {
        margin-top: 14px; rotate: 2deg; padding: 12px 28px;
        font: 700 0.85rem/1 "DM Sans", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #ffbe4f;
        background: repeating-linear-gradient(-45deg, #1a1a14 0 14px, #ffbe4f 14px 28px);
        text-shadow: 0 0 6px #000, 0 0 2px #000;
      }
      p { max-width: 420px; color: #98bcc7; line-height: 1.6; }
      nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      nav a {
        padding: 10px 18px; border: 1px solid #38d6ff59; color: #9beeff; text-decoration: none;
        font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
        background: #031522a6; transition: border-color 0.2s, color 0.2s;
      }
      nav a:hover, nav a:focus-visible { border-color: #38d6ff; color: #fff; outline: none; }
      nav a:focus-visible { box-shadow: 0 0 0 2px #ffbe4f; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sign">
        <span class="plank">The Abyss</span>
        <span class="plank">Under construction</span>
      </h1>
      <p>This part of the ocean is still being explored. Experiments and works in progress will surface here soon.</p>
      <nav aria-label="Leave the abyss">
        <a href="./#crossroads">Swim back up</a>
        <a href="projects/">Visit the reef</a>
      </nav>
    </main>
    <script>
      addEventListener("pointermove", (e) => {
        document.body.style.setProperty("--x", e.clientX + "px");
        document.body.style.setProperty("--y", e.clientY + "px");
      });
    </script>
  </body>
</html>
